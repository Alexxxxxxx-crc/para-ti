<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Stefany</title>
<style>
  :root {
    --fondo: #070405;
    --palabra: #ff5b4f;
    --brillo: rgba(255, 70, 60, 0.55);
    --nombre: #fff1ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--fondo); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body {
    font-family: "Segoe UI", "Noto Sans", "Noto Sans CJK SC", "Apple SD Gothic Neo",
                 "Malgun Gothic", "Microsoft YaHei", "Yu Gothic", "Nirmala UI", "Leelawadee UI", sans-serif;
  }

  #escena {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a0709 0%, var(--fondo) 70%);
  }
  #particulas { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  #corazon {
    position: absolute; inset: 0; z-index: 1;
    animation: latido 2.4s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    12%      { transform: scale(1.025); }
    24%      { transform: scale(1); }
    36%      { transform: scale(1.018); }
    48%      { transform: scale(1); }
  }

  .palabra {
    position: absolute;
    white-space: nowrap;
    font-weight: 600;
    color: var(--palabra);
    text-shadow: 0 0 8px var(--brillo);
    opacity: 0;
    transition: transform .35s ease-out, color .35s, text-shadow .35s;
    animation: aparecer 1.2s ease-out forwards, titilar var(--dur) ease-in-out var(--ret) infinite;
    animation-delay: var(--entrada), calc(var(--entrada) + 1.2s);
  }
  @keyframes aparecer { from { opacity: 0; filter: blur(4px); } to { opacity: var(--op); filter: blur(0); } }
  @keyframes titilar {
    0%, 100% { opacity: var(--op); }
    50%      { opacity: calc(var(--op) * 0.25); }
  }

  #nombre {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 2;
  }
  #nombre h1 {
    font-family: "Segoe Script", "Snell Roundhand", "Brush Script MT", "Lucida Handwriting", cursive;
    font-weight: 400;
    color: var(--nombre);
    font-size: clamp(1.3rem, 4.6vw, 2.6rem);
    line-height: 1;
    text-shadow: 0 0 14px rgba(255, 90, 80, 0.9), 0 0 40px rgba(255, 60, 50, 0.7), 0 0 80px rgba(255, 40, 40, 0.5);
    opacity: 0;
    animation: nombreIn 2s ease-out 1.2s forwards, respirar 3.2s ease-in-out 3.2s infinite;
  }
  #nombre .mini {
    margin-top: .25rem;
    font-size: clamp(.6rem, 1.6vw, .8rem);
    letter-spacing: .08em;
    color: #ffb3aa;
    text-shadow: 0 0 10px rgba(255, 70, 60, .8);
    opacity: 0;
    animation: nombreIn 2s ease-out 2.2s forwards;
  }
  @keyframes nombreIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes respirar {
    0%, 100% { text-shadow: 0 0 14px rgba(255,90,80,.9), 0 0 40px rgba(255,60,50,.7), 0 0 80px rgba(255,40,40,.5); }
    50%      { text-shadow: 0 0 20px rgba(255,120,110,1), 0 0 60px rgba(255,60,50,.9), 0 0 110px rgba(255,40,40,.7); }
  }

  #dedicatoria {
    position: absolute; left: 50%; bottom: max(3vh, 16px);
    transform: translateX(-50%);
    width: min(90vw, 760px);
    text-align: center;
    z-index: 2; pointer-events: none;
    font-family: "Segoe Script", "Snell Roundhand", "Brush Script MT", "Lucida Handwriting", cursive;
    font-size: clamp(.95rem, 2.6vw, 1.5rem);
    line-height: 1.5;
    color: #ffd9d4;
    text-shadow: 0 0 10px rgba(255, 80, 70, .8);
    min-height: 1.5em;
  }
  #dedicatoria::after {
    content: ""; display: inline-block; width: 2px; height: 1.05em;
    margin-left: 3px; vertical-align: -0.15em; background: #ffb3aa;
    animation: cursor 1s steps(1) infinite;
  }
  #dedicatoria.fin::after { display: none; }
  @keyframes cursor { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #corazon, .palabra, #nombre h1 { animation-duration: 0.01s; animation-iteration-count: 1; }
    .palabra { opacity: var(--op); }
  }
</style>
</head>
<body>
<div id="escena">
  <canvas id="particulas"></canvas>
  <div id="corazon"></div>
  <div id="nombre">
    <h1>Stefany</h1>
    <p class="mini">te amo</p>
  </div>
  <p id="dedicatoria"></p>
</div>

<script>
  const NOMBRE = "Stefany";
  const DEDICATORIA = "Cada idioma se queda corto para decirte lo que siento por ti chiquilla";

  const FRASES = [
    "Te amo", "Te quiero", "I love you", "Je t'aime", "Ich liebe dich", "Ti amo", "Eu te amo",
    "愛してる", "我爱你", "我愛你", "사랑해", "Я тебя люблю", "Я тебе кохаю", "Σ' αγαπώ",
    "Kocham cię", "Jag älskar dig", "Jeg elsker deg", "Jeg elsker dig", "Ik hou van jou",
    "Seni seviyorum", "Aku cinta kamu", "Aku cintakan kamu", "Anh yêu em", "ฉันรักเธอ",
    "मैं तुमसे प्यार करता हूँ", "मैं तुमसे प्यार करती हूँ", "আমি তোমাকে ভালোবাসি",
    "நான் உன்னை காதலிக்கிறேன்", "నేను నిన్ను ప్రేమిస్తున్నాను", "मी तुझ्यावर प्रेम करतो",
    "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "म तिमीलाई माया गर्छु", "මම ඔබට ආදරෙයි",
    "Te iubesc", "T'estimo", "Quérote", "Maite zaitut", "Miluji tě", "Ľúbim ťa", "Szeretlek",
    "Minä rakastan sinua", "Ég elska þig", "Es tevi mīlu", "Aš tave myliu", "Ma armastan sind",
    "Volim te", "Обичам те", "Të dua", "Amo te", "Mi amas vin", "მიყვარხარ", "Ես քեզ սիրում եմ",
    "Би чамд хайртай", "Мен сені жақсы көремін", "Seni sevaman", "Səni sevirəm",
    "Mahal kita", "Nakupenda", "Ngiyakuthanda", "Ek is lief vir jou", "Mo nifẹ rẹ", "Ina son ka",
    "Waan ku jeclahay", "እወድሃለሁ", "Inħobbok", "Ech hunn dech gär", "Tá grá agam duit",
    "Dw i'n dy garu di", "Tha gaol agam ort", "Aloha au iā ʻoe", "Aroha ahau ki a koe",
    "أحبك", "אני אוהב אותך", "איך האב דיך ליב", "دوستت دارم", "میں تم سے پیار کرتا ہوں",
    "ខ្ញុំស្រលាញ់អ្នក", "ຂ້ອຍຮັກເຈົ້າ", "Aku tresna karo kowe", "Mwen renmen w",
    "Nimitztlazohtla", "Munayki", "Rohayhu"
  ];

  document.querySelector("#nombre h1").textContent = NOMBRE;

  const cont = document.getElementById("corazon");
  const medidor = document.createElement("canvas").getContext("2d");

  const CORAZON = [];
  for (let t = 0; t < Math.PI * 2; t += Math.PI / 180) {
    CORAZON.push([
      16 * Math.pow(Math.sin(t), 3),
      13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)
    ]);
  }
  let poli = [];
  function dentro(x, y) {
    let r = false;
    for (let a = 0, b = poli.length - 1; a < poli.length; b = a++) {
      const [xa, ya] = poli[a], [xb, yb] = poli[b];
      if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) r = !r;
    }
    return r;
  }
  function rectDentro(r) {
    const mx = r.x + r.w / 2, my = r.y + r.h / 2;
    return [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h],
            [mx, r.y], [mx, r.y + r.h], [r.x, my], [r.x + r.w, my]].every(p => dentro(p[0], p[1]));
  }
  function choca(a, b, pad) {
    return !(a.x + a.w + pad < b.x || b.x + b.w + pad < a.x ||
             a.y + a.h + pad < b.y || b.y + b.h + pad < a.y);
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  function construir() {
    cont.innerHTML = "";
    const W = innerWidth, H = innerHeight;
    const Hh = H * 0.86;
    const k = Math.min(W / 35, Hh / 33);
    const ox = W / 2, oy = Hh / 2 - 2.5 * k;
    palabras = [];
    poli = CORAZON.map(([x, y]) => [ox + x * k, oy - y * k]);

    const nom = document.getElementById("nombre");
    nom.style.left = ox + "px";
    nom.style.top = (oy - 0.5 * k) + "px";
    const nr = nom.getBoundingClientRect();
    const reservada = { x: nr.left - 8, y: nr.top - 6, w: nr.width + 16, h: nr.height + 12 };

    const colocadas = [reservada];
    const base = Math.max(8.5, Math.min(16, k * 0.58));

    for (let i = 0; i < 25000; i++) {
      const texto = FRASES[Math.floor(Math.random() * FRASES.length)];
      const tam = rand(base * 0.78, base * 1.3);
      medidor.font = `600 ${tam}px "Segoe UI", "Noto Sans", sans-serif`;
      const w = medidor.measureText(texto).width + 2;
      const h = tam * 1.2;
      const x = rand(ox - 16 * k, ox + 16 * k - w);
      const y = rand(oy - 12 * k, oy + 17 * k - h);
      const r = { x, y, w, h };

      if (!rectDentro(r)) continue;
      if (colocadas.some(o => choca(r, o, 2))) continue;

      colocadas.push(r);
      const el = document.createElement("span");
      el.className = "palabra";
      el.textContent = texto;
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.fontSize = tam + "px";
      el.style.setProperty("--op", rand(0.7, 1).toFixed(2));
      el.style.setProperty("--dur", rand(2.5, 6).toFixed(2) + "s");
      el.style.setProperty("--ret", rand(0, 4).toFixed(2) + "s");
      const progreso = (y - (oy - 12 * k)) / (29 * k);
      el.style.setProperty("--entrada", ((1 - progreso) * 2.2 + rand(0, 0.8)).toFixed(2) + "s");
      cont.appendChild(el);
      palabras.push({ el, cx: x + w / 2, cy: y + h / 2 });
    }
  }

  setInterval(() => {
    const els = cont.querySelectorAll(".palabra");
    if (!els.length) return;
    for (let k = 0; k < 3; k++) {
      const el = els[Math.floor(Math.random() * els.length)];
      const nueva = FRASES[Math.floor(Math.random() * FRASES.length)];
      if (nueva.length <= el.textContent.length) el.textContent = nueva;
    }
  }, 1600);

  let palabras = [];
  const RADIO = 95;
  let activas = new Set();
  function tocarEn(px, py) {
    const ahora = new Set();
    for (const p of palabras) {
      const dx = p.cx - px, dy = p.cy - py;
      const d = Math.hypot(dx, dy);
      if (d < RADIO) {
        const f = 1 - d / RADIO;
        const n = d || 1;
        p.el.style.transform = `translate(${(dx / n) * f * 14}px, ${(dy / n) * f * 14}px) scale(${1 + f * 0.7})`;
        p.el.style.color = "#fff3f0";
        p.el.style.textShadow = `0 0 ${8 + f * 14}px rgba(255,120,110,1)`;
        ahora.add(p);
      }
    }
    for (const p of activas) if (!ahora.has(p)) soltar(p);
    activas = ahora;
  }
  function soltar(p) { p.el.style.transform = ""; p.el.style.color = ""; p.el.style.textShadow = ""; }
  function soltarTodo() { activas.forEach(soltar); activas.clear(); }

  addEventListener("pointermove", e => { tocarEn(e.clientX, e.clientY); });
  addEventListener("pointerdown", e => { tocarEn(e.clientX, e.clientY); explotar(e.clientX, e.clientY); });
  addEventListener("pointerup", e => { if (e.pointerType !== "mouse") soltarTodo(); });
  addEventListener("pointerleave", soltarTodo);

  const cv = document.getElementById("particulas");
  const c2 = cv.getContext("2d");
  let DPR = 1, parts = [];
  const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function ajustarCanvas() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  }
  function dibujarCorazon(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.7);
    c.bezierCurveTo(x - s * 1.1, y + s * 0.1, x - s * 0.7, y - s * 0.9, x, y - s * 0.25);
    c.bezierCurveTo(x + s * 0.7, y - s * 0.9, x + s * 1.1, y + s * 0.1, x, y + s * 0.7);
    c.fill();
  }
  function nuevaAmbiente(inicio) {
    const esChispa = Math.random() < 0.45;
    return {
      x: rand(0, innerWidth),
      y: inicio ? rand(0, innerHeight) : innerHeight + 20,
      vx: 0, vy: -rand(0.25, 0.8),
      s: esChispa ? rand(0.8, 2.2) : rand(4, 11),
      a: rand(0.12, 0.45), fase: rand(0, 6.28), chispa: esChispa,
      vida: Infinity, tono: Math.floor(rand(70, 130))
    };
  }
  function explotar(x, y) {
    if (reducir) return;
    for (let i = 0; i < 16; i++) {
      const ang = rand(0, 6.28), v = rand(1.2, 4);
      parts.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 1,
                   s: rand(5, 12), a: 0.9, fase: 0, chispa: false, vida: rand(50, 90), max: 90,
                   tono: Math.floor(rand(70, 140)), burst: true });
    }
  }
  function bucle() {
    c2.setTransform(DPR, 0, 0, DPR, 0, 0);
    c2.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.burst) { p.vy += 0.03; p.vx *= 0.985; p.vida--; }
      p.fase += 0.02;
      p.x += p.vx + (p.burst ? 0 : Math.sin(p.fase) * 0.35);
      p.y += p.vy;
      let alfa = p.a;
      if (p.burst) alfa = p.a * Math.max(0, p.vida / p.max);
      else if (p.chispa) alfa = p.a * (0.5 + 0.5 * Math.sin(p.fase * 3));
      if ((p.burst && p.vida <= 0) || p.y < -30) {
        if (p.burst) parts.splice(i, 1); else parts[i] = nuevaAmbiente(false);
        continue;
      }
      c2.globalAlpha = Math.max(0, alfa);
      c2.fillStyle = `rgb(255, ${p.tono}, ${p.tono - 10})`;
      if (p.chispa) { c2.beginPath(); c2.arc(p.x, p.y, p.s, 0, 6.28); c2.fill(); }
      else dibujarCorazon(c2, p.x, p.y, p.s);
    }
    c2.globalAlpha = 1;
    requestAnimationFrame(bucle);
  }
  function iniciarParticulas() {
    ajustarCanvas();
    if (reducir) return;
    const n = Math.round(Math.min(60, Math.max(22, innerWidth / 22)));
    parts = parts.filter(p => p.burst);
    for (let i = 0; i < n; i++) parts.push(nuevaAmbiente(true));
  }
  iniciarParticulas();
  if (!reducir) requestAnimationFrame(bucle);

  (function escribir() {
    const el = document.getElementById("dedicatoria");
    if (reducir) { el.textContent = DEDICATORIA; el.classList.add("fin"); return; }
    let i = 0;
    function paso() {
      el.textContent = DEDICATORIA.slice(0, ++i);
      if (i < DEDICATORIA.length) setTimeout(paso, rand(55, 110));
      else setTimeout(() => el.classList.add("fin"), 2500);
    }
    setTimeout(paso, 5500);
  })();

  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { construir(); iniciarParticulas(); }, 250); });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(construir);
</script>
</body>
</html>
